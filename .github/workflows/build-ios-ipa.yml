name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-ipa.yml'
      - 'ios/**'
      - 'App.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate iOS app icon
        run: |
          python3 - <<'PY'
          import json, struct, zlib
          from pathlib import Path
          target = Path('ios/PulseLibre/Images.xcassets/AppIcon.appiconset')
          target.mkdir(parents=True, exist_ok=True)
          n = 1024
          # Opaque indigo background and bold white pulse trace
          pts = [(140,510),(328,510),(420,685),(514,310),(602,592),(670,466),(740,510),(885,510)]
          raw = bytearray()
          for y in range(n):
              raw.append(0)
              for x in range(n):
                  d = min(
                      ((x-(ax + max(0,min(1,((x-ax)*(bx-ax)+(y-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2)))*(bx-ax)))**2 +
                       (y-(ay + max(0,min(1,((x-ax)*(bx-ax)+(y-ay)*(by-ay))/((bx-ax)**2+(by-ay)**2)))*(by-ay)))**2)
                      for (ax,ay),(bx,by) in zip(pts,pts[1:])
                  )
                  if d < 150:
                      raw.extend((255,255,255,255))
                  else:
                      raw.extend((45,61,166,255))
          def part(tag,data):
              return struct.pack('>I',len(data))+tag+data+struct.pack('>I',zlib.crc32(tag+data)&0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'+part(b'IHDR',struct.pack('>IIBBBBB',n,n,8,6,0,0,0))+part(b'IDAT',zlib.compress(raw,6))+part(b'IEND',b'')
          (target/'PulseLibre.png').write_bytes(png)
          (target/'Contents.json').write_text(json.dumps({'images':[{'filename':'PulseLibre.png','idiom':'universal','platform':'ios','size':'1024x1024'}],'info':{'author':'xcode','version':1}}))
          PY
      - name: Verify icon
        run: test -s ios/PulseLibre/Images.xcassets/AppIcon.appiconset/PulseLibre.png
      - name: Install CocoaPods
        run: |
          cd ios
          # Regenerate CocoaPods metadata to match the currently resolved React Native.
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update
          test -f "Pods/Target Support Files/Pods-PulseLibre/Pods-PulseLibre.release.xcconfig"
      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/PulseLibre.xcworkspace \
            -scheme PulseLibre \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/PulseLibre.app"
          test -d "$APP"
          echo "=== Verify packaged iOS Bluetooth privacy settings ==="
          /usr/libexec/PlistBuddy -c 'Print :NSBluetoothAlwaysUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -f "$APP/main.jsbundle" || { echo "Missing bundled JS"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ( cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/PulseLibre-unsigned.ipa" Payload )
          unzip -t "$GITHUB_WORKSPACE/PulseLibre-unsigned.ipa" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: PulseLibre-unsigned-ipa
          path: PulseLibre-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
